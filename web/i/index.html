<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rytho — Davet</title>
  <meta name="description" content="Rytho'da seni bekleyen bir davet var.">

  <!-- Uygulama kuruluysa isletim sistemi bu sayfayi hic acmaz; dogrudan
       uygulamaya gider (Android App Links / iOS Universal Links). Bu sayfa
       yalnizca uygulama KURULU DEGILSE gorunur. -->

  <meta property="og:title" content="Rytho — bir davetin var">
  <meta property="og:description"
        content="Gercek gokyuzu hesabina dayanan gunluk okuma. Arkadasin seni ekledi.">
  <meta property="og:type" content="website">

  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(180deg, #13091F 0%, #241038 55%, #0B0713 100%);
      color: #EFE7DA;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   Helvetica, Arial, sans-serif;
      text-align: center;
    }
    main { max-width: 420px; width: 100%; }
    .glyph { font-size: 56px; color: #F2C14E; margin-bottom: 12px; }
    h1 { font-size: 28px; margin: 0 0 10px; letter-spacing: -0.3px; }
    p { color: #B9AFC4; line-height: 1.6; margin: 0 0 28px; font-size: 15px; }
    .username { color: #F2C14E; font-weight: 600; }
    a.store {
      display: block;
      padding: 15px 20px;
      margin-bottom: 12px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      background: linear-gradient(135deg, #7B4BC9, #C8479B);
      color: #fff;
    }
    a.secondary {
      background: transparent;
      border: 1px solid rgba(239, 231, 218, 0.22);
      color: #EFE7DA;
    }
    .note { font-size: 12px; color: #7E7490; margin-top: 22px; }
  </style>
</head>
<body>
  <main>
    <div class="glyph">✦</div>
    <h1 id="baslik">Rytho'da bir davetin var</h1>
    <p>
      <span class="username" id="username"></span>
      <span id="govde">seni arkadaş olarak ekledi. Daveti kabul etmek için
        uygulamayı aç.</span>
    </p>

    <!-- iOS kapsam disi: "App Store'dan indir" dugmesi hicbir yere
         gitmiyordu (href="#") ve Android'de de gorunuyordu. Calismayan bir
         dugme, cevrilmemis metinden daha kotu bir ilk izlenim. -->
    <a class="store" id="play"
       href="https://play.google.com/store/apps/details?id=ai.rytho">
      Google Play'den indir
    </a>

    <p class="note" id="not">
      Uygulama zaten kuruluysa bu bağlantı doğrudan Rytho'da açılır.
    </p>
  </main>

  <script>
    'use strict';

    // ---- Dil. web/auth/action/index.html ile AYNI desen.
    //
    // Bu sayfa yalnizca uygulama KURULU DEGILKEN aciliyor, yani yeni
    // testcinin gordugu ilk yuzey; tek dilli kalirsa Ingilizce telefondaki
    // davetli tamamen Turkce bir karsilama goruyor.
    //
    // Asil sinyal `navigator.language`: davet baglantisi (`inviteLinkFor`)
    // bilerek `?lang=` TASIMIYOR, cunku GONDERENIN dili alicinin dili
    // degil. `?lang=` yalniz elle QA icin okunuyor.
    var params = new URLSearchParams(window.location.search);
    var lang = (params.get('lang') || navigator.language || 'tr')
      .toLowerCase().slice(0, 2);
    if (lang !== 'en') lang = 'tr';
    document.documentElement.lang = lang;

    var T = {
      tr: {
        pageTitle: 'Rytho — Davet',
        baslik: 'Rytho\'da bir davetin var',
        govde: 'seni arkadaş olarak ekledi. Daveti kabul etmek için uygulamayı aç.',
        anonim: 'Bir arkadaşın',
        magaza: 'Google Play\'den indir',
        not: 'Uygulama zaten kuruluysa bu bağlantı doğrudan Rytho\'da açılır.'
      },
      en: {
        pageTitle: 'Rytho — Invitation',
        baslik: 'You have an invitation on Rytho',
        govde: 'added you as a friend. Open the app to accept the invitation.',
        anonim: 'A friend of yours',
        magaza: 'Get it on Google Play',
        not: 'If the app is already installed, this link opens straight in Rytho.'
      }
    }[lang];

    document.title = T.pageTitle;
    document.getElementById('baslik').textContent = T.baslik;
    document.getElementById('govde').textContent = T.govde;
    document.getElementById('play').textContent = T.magaza;
    document.getElementById('not').textContent = T.not;

    // Kullanici adi yoldan okunur: /i/gezgin
    var parcalar = window.location.pathname.split('/').filter(Boolean);
    var kullanici = parcalar.length > 1 ? decodeURIComponent(parcalar[1]) : '';
    document.getElementById('username').textContent =
      kullanici ? '@' + kullanici : T.anonim;
  </script>
</body>
</html>
