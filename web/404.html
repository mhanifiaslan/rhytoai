<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sayfa bulunamadı · RythoAI</title>
  <style>
    /* Marka tonunda 404 (W0): davet sayfasıyla aynı zemin dili.
       Admin dahil eşleşmeyen HER yol buraya düşer — sayfa hiçbir yol
       hakkında bilgi vermez. */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #0B0710 0%, #14091E 100%);
      color: #F4EFFA;
      font-family: 'Segoe UI', system-ui, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .yildiz { font-size: 40px; color: #FFC24B; }
    h1 { font-size: 22px; margin: 16px 0 8px; font-weight: 600; }
    p { color: #A99EC2; font-size: 14px; line-height: 1.55; }
    a {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 28px;
      border-radius: 999px;
      background: linear-gradient(135deg, #7B2FF7, #B02EFF, #E64ACF);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <div class="yildiz">✦</div>
    <h1>Bu gökyüzünde böyle bir sayfa yok</h1>
    <p>Aradığın yol haritada görünmüyor.</p>
    <a href="/">Ana sayfaya dön</a>
  </main>
</body>
</html>
