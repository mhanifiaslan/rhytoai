<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Rytho Yönetim</title>
  <link rel="icon" href="/assets/rytho_logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/rytho.css?v=2">
  <style>
    /* Panel kabuğu — site token'ları rytho.css'ten. */
    body { min-height: 100vh; }
    .kabuk { display: none; max-width: 1180px; margin: 0 auto; padding: 24px; }
    .ust {
      display: flex; align-items: center; gap: 14px;
      padding-bottom: 18px; border-bottom: 1px solid var(--line);
      margin-bottom: 22px;
    }
    .ust img { width: 34px; height: 34px; }
    .ust h1 { font-size: 18px; flex: 1; }
    .ust .mono { font-size: 11px; }
    .ust button {
      background: none; border: 1px solid var(--glass-stroke);
      color: var(--parchment-dim); border-radius: var(--r-pill);
      padding: 7px 16px; cursor: pointer; font-family: inherit;
      font-size: 12.5px;
    }
    nav.sekmeler { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
    nav.sekmeler a {
      text-decoration: none; color: var(--parchment-dim);
      padding: 9px 18px; border-radius: var(--r-pill);
      border: 1px solid var(--glass-stroke); font-size: 13px;
      font-weight: 700;
    }
    nav.sekmeler a.aktif {
      background: var(--primary-gradient); color: #fff;
      border-color: rgba(255,255,255,0.2);
    }
    .kartlar { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-bottom: 22px; }
    .kart { padding: 18px; }
    .kart .deger { font-family: 'Sora', sans-serif; font-size: 30px; font-weight: 700; }
    .kart .ad { color: var(--parchment-dim); font-size: 12px; margin-top: 4px; }
    .kart .deger.altin { color: var(--gold); }
    .panel h2 { font-size: 15px; margin-bottom: 12px; }
    canvas.grafik { width: 100%; height: 120px; display: block; }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    th { text-align: left; color: var(--lilac); font-size: 11px;
         text-transform: uppercase; letter-spacing: 0.8px;
         padding: 8px 10px; border-bottom: 1px solid var(--line); }
    td { padding: 9px 10px; border-bottom: 1px solid var(--line);
         color: var(--parchment-dim); }
    td.sayi { font-family: 'JetBrains Mono', monospace; color: var(--parchment); text-align: right; }
    .bos { text-align: center; color: var(--parchment-dim); padding: 48px 0; }
    .hata { color: var(--madder); font-size: 13.5px; padding: 12px 0; }
    .izgara-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 760px) { .izgara-2 { grid-template-columns: 1fr; } }

    /* Giriş ve jenerik görünümler */
    .orta {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: 24px; gap: 18px;
    }
    .orta img { width: 64px; height: 64px; }
  </style>
</head>
<body>
  <div class="gokyuzu"></div>

  <!-- Jenerik görünüm: yetkisiz herkese — panelin varlığını ele vermez. -->
  <div id="bulunamadi" class="orta" style="display:none">
    <div style="font-size:40px;color:var(--gold)">✦</div>
    <h1 style="font-size:22px">Bu gökyüzünde böyle bir sayfa yok</h1>
    <a class="buton ikincil" href="/">Ana sayfa</a>
  </div>

  <!-- Giriş: tek buton. Sayfa hiçbir yerden linklenmez. -->
  <div id="giris" class="orta" style="display:none">
    <img src="/assets/rytho_logo.svg" alt="">
    <button id="google-gir" class="buton">Google ile devam et</button>
  </div>

  <!-- Panel kabuğu -->
  <div id="uygulama" class="kabuk">
    <div class="ust">
      <img src="/assets/rytho_logo.svg" alt="">
      <h1>Rytho Yönetim</h1>
      <span id="sunucu-saat" class="mono"></span>
      <button id="cikis">Çıkış</button>
    </div>
    <nav class="sekmeler">
      <a href="#/genel">Genel Bakış</a>
      <a href="#/kullanicilar">Kullanıcılar</a>
      <a href="#/gelir">Gelir</a>
      <a href="#/ortaklar">Ortaklar</a>
      <a href="#/sistem">Sistem</a>
    </nav>
    <div id="icerik"><div class="bos">Yükleniyor…</div></div>
  </div>

  <!-- Firebase — Hosting'in rezerve SDK yolları (dış CDN yok) -->
  <script src="/__/firebase/10.12.2/firebase-app-compat.js"></script>
  <script src="/__/firebase/10.12.2/firebase-auth-compat.js"></script>
  <script src="/__/firebase/init.js"></script>

  <script src="/rytho-admin/api.js"></script>
  <script src="/rytho-admin/charts.js"></script>
  <script src="/rytho-admin/views.js"></script>
  <script src="/rytho-admin/app.js"></script>
</body>
</html>
