<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Rytho Yönetim</title>
  <link rel="icon" href="/assets/rytho_logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/rytho.css?v=2">
  <link rel="stylesheet" href="/rytho-admin/admin.css">
</head>
<body>
  <!-- Sitedeki canlı gökyüzü: starfield.js #yildizlar'ı bulur;
       prefers-reduced-motion'da tek statik kare çizer. -->
  <div class="gokyuzu"><canvas id="yildizlar"></canvas></div>

  <!-- Jenerik görünüm: yetkisiz herkese — panelin varlığını ele vermez. -->
  <div id="bulunamadi" class="orta" style="display:none">
    <div style="font-size:40px;color:var(--gold)">✦</div>
    <h1 style="font-size:22px">Bu gökyüzünde böyle bir sayfa yok</h1>
    <a class="buton ikincil" href="/">Ana sayfa</a>
  </div>

  <!-- Giriş: tek buton. Sayfa hiçbir yerden linklenmez. -->
  <div id="giris" class="orta" style="display:none">
    <img src="/assets/rytho_logo.svg" alt="">
    <div class="giris-kart">
      <form id="eposta-form" class="giris-form">
        <input class="girdi" name="email" type="email" placeholder="E-posta"
               autocomplete="username" aria-label="E-posta">
        <input class="girdi" name="password" type="password" placeholder="Şifre"
               autocomplete="current-password" aria-label="Şifre">
        <button class="buton" type="submit">Giriş yap</button>
      </form>
      <div class="giris-ayrac"><span>ya da</span></div>
      <button id="google-gir" class="buton ikincil">Google ile devam et</button>
      <button id="sifre-unut" class="giris-unut" type="button">
        Şifreni mi unuttun?</button>
    </div>
    <p id="giris-hata" role="alert"
       style="display:none;color:var(--madder);font-size:13px;max-width:340px"></p>
    <p id="giris-bilgi" role="status"
       style="display:none;color:var(--celadon);font-size:13px;max-width:340px"></p>
  </div>

  <!-- Panel kabuğu: yan menü (geniş) / üst pill (dar) -->
  <div id="uygulama" class="kabuk">
    <aside class="yan-menu">
      <div class="marka">
        <img src="/assets/rytho_logo.svg" alt="">
        <div><b>Rytho</b><span>Yönetim</span></div>
      </div>
      <div class="profil-blok">
        <div class="avatar" id="admin-avatar">?</div>
        <div class="kim">
          <span class="rol">Yönetici</span>
          <span id="admin-eposta" class="mono"></span>
        </div>
      </div>
      <nav aria-label="Bölümler" id="yan-nav">
        <a href="#/genel" data-ikon="panel">Genel Bakış</a>
        <a href="#/kullanicilar" data-ikon="kullanicilar">Kullanıcılar</a>
        <a href="#/ekonomi" data-ikon="ekonomi">Ekonomi</a>
        <a href="#/ai" data-ikon="ai">AI Kullanımı</a>
        <a href="#/ortaklar" data-ikon="ortaklar">Ortaklar</a>
        <a href="#/sistem" data-ikon="sistem">Sistem</a>
      </nav>
      <div class="alt">
        <div class="durum-satir">
          <span class="durum-nokta" id="backend-nokta"></span>
          <span id="backend-durum">Backend</span>
        </div>
        <button id="cikis" class="cikis-dugme">Çıkış</button>
      </div>
    </aside>

    <div class="ana">
      <header class="ust-cubuk">
        <h1 id="sayfa-baslik">Rytho Yönetim</h1>
        <label class="genel-ara" id="genel-ara-kutu">
          <span id="ara-ikon" aria-hidden="true"></span>
          <input id="genel-ara" placeholder="Kullanıcı ara…"
                 aria-label="Kullanıcı ara">
        </label>
        <span id="sunucu-saat" class="mono"></span>
      </header>
      <nav class="sekme-ust" aria-label="Bölümler">
        <a href="#/genel">Genel</a>
        <a href="#/kullanicilar">Kullanıcılar</a>
        <a href="#/ekonomi">Ekonomi</a>
        <a href="#/ai">AI</a>
        <a href="#/ortaklar">Ortaklar</a>
        <a href="#/sistem">Sistem</a>
      </nav>
      <main id="icerik" class="icerik-alan" aria-busy="false"></main>
    </div>
  </div>

  <!-- Firebase — Hosting'in rezerve SDK yolları (dış CDN yok) -->
  <script src="/__/firebase/10.12.2/firebase-app-compat.js"></script>
  <script src="/__/firebase/10.12.2/firebase-auth-compat.js"></script>
  <script src="/__/firebase/init.js"></script>

  <script src="/assets/starfield.js"></script>
  <script src="/rytho-admin/api.js"></script>
  <script src="/rytho-admin/ikonlar.js"></script>
  <script src="/rytho-admin/bilesenler.js"></script>
  <script src="/rytho-admin/charts.js"></script>
  <script src="/rytho-admin/gorunumler/genel.js"></script>
  <script src="/rytho-admin/gorunumler/kullanicilar.js"></script>
  <script src="/rytho-admin/gorunumler/ekonomi.js"></script>
  <script src="/rytho-admin/gorunumler/ai.js"></script>
  <script src="/rytho-admin/gorunumler/ortaklar.js"></script>
  <script src="/rytho-admin/gorunumler/sistem.js"></script>
  <script src="/rytho-admin/app.js"></script>
</body>
</html>
